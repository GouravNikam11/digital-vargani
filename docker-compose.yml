services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vargani
      POSTGRES_PASSWORD: vargani
      POSTGRES_DB: vargani
    ports:
      - "5432:5432"
    volumes:
      - vargani_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vargani -d vargani"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vargani_pg:
